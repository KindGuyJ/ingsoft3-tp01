name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    # TP6: permiso para publicar en ghcr.io. Por job y no a nivel del workflow:
    # alla reemplazaria el default de TODOS los jobs (minimo privilegio).
    # Lo que no se lista queda sin permiso: contents: read es para el checkout.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"
      - name: Bajar el código al runner
        uses: actions/checkout@v7
      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      # ---- TP5: tests + cobertura, con la MISMA receta que la imagen ----
      - name: Construir la etapa de tests del backend
        uses: docker/build-push-action@v7
        with:
          context: ./app/backend
          target: test          # se detiene en la etapa de tests, no llega a final
          load: true            # la deja en el Docker local, para poder correrla
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      # El ENTRYPOINT de la etapa es cobertura.sh: corre los tests y sale con
      # error si la cobertura no llega al umbral. Ese codigo de salida es el freno.
      - name: Correr los tests con cobertura (umbral)
        run: docker run --rm -v "${{ github.workspace }}/backend-cobertura:/out" backend-test:ci

      - name: Resumen de cobertura del backend
        if: ${{ !cancelled() }}   # tambien cuando el umbral fallo: es la corrida que se mira
        run: |
          test -f backend-cobertura/resumen.txt   # si no esta, el paso falla: mejor rojo que vacio
          {
            echo "### Cobertura del backend"
            echo '```'
            cat backend-cobertura/resumen.txt
            echo '```'
            echo "<details><summary>Por funcion</summary>"
            echo
            echo '```'
            sed 's#github.com/KindGuyJ/ingsoft3-tp01/app/backend/##' backend-cobertura/cobertura.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar el reporte de cobertura del backend
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-backend
          path: |
            backend-cobertura/cobertura.html
            backend-cobertura/cobertura.txt
            backend-cobertura/ramas.txt
            backend-cobertura/resumen.txt

      # ---- TP6: publicar el artefacto, y solo el que paso ----
      # Estos dos pasos van ULTIMOS y SIN !cancelled() ni always(): si los tests
      # fallaron, el job murio antes y nunca se llega aca. La condicion "solo si
      # la verificacion paso" no esta escrita en un if: esta en el orden.
      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publica el MISMO paso que construye: un job aparte tendria que volver a
      # construir, y lo publicado seria una reconstruccion, no lo verificado.
      # Las dos condiciones del push (evento Y rama) para que el dia que se
      # agregue otra rama al disparador, esa rama no publique.
      # El nombre va escrito en minusculas: ${{ github.repository }} trae
      # "KindGuyJ" y el registry no acepta mayusculas.
      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./app/backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/kindguyj/tienda-backend:sha-${{ github.sha }}
          # TP7: el commit queda adentro de la imagen y la api lo devuelve en
          # /healthz. Render ya no construye, asi que no hay otro que lo diga.
          build-args: COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:          # mismo criterio que en build-backend
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"
      - name: Bajar el código al runner
        uses: actions/checkout@v7
      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      # ---- TP5: tests + cobertura, con la MISMA receta que la imagen ----
      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./app/frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      # npm run test:ci = vitest con --coverage: los thresholds de vite.config.js
      # hacen que salga con error si no se llega. Ese codigo de salida es el freno.
      - name: Correr los tests con cobertura (umbral)
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/frontend-cobertura:/salida" frontend-test:ci

      - name: Resumen de cobertura del frontend
        if: ${{ !cancelled() }}
        run: |
          F=frontend-cobertura/reporte/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisar el include'); process.exit(1); }
            console.log('### Cobertura del frontend');
            console.log('| metrica | cubierto | % |');
            console.log('|---|---|---|');
            for (const m of ['lines', 'branches', 'functions', 'statements'])
              console.log('| ' + m + ' | ' + t[m].covered + '/' + t[m].total + ' | ' + t[m].pct + '% |');
          " >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar el reporte de cobertura del frontend
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-frontend
          path: frontend-cobertura/reporte

      # ---- TP6: publicar el artefacto (mismo criterio que en build-backend) ----
      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./app/frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/kindguyj/tienda-frontend:sha-${{ github.sha }}
          build-args: COMMIT=${{ github.sha }}   # → /version.txt (mismo criterio)
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ==================== TP6/TP7: la promoción ====================
  #
  #   build-* (verde) → deploy-qa (automático) → [aprobación] → deploy-prod
  #
  # TP7: los cuatro servicios de Render son "Existing Image". El hook ya no le
  # pide a Render que construya un commit: le dice QUE IMAGEN ejecutar
  # (imgURL=...:sha-<commit>). QA y PROD corren la misma imagen que publicaron
  # los jobs de arriba, bit a bit: build once, deploy many.
  #
  # La URL del hook va ULTIMA en el curl: es el unico argumento suelto, y
  # --data-urlencode se lleva el valor que tiene al lado. --get agrega imgURL
  # con '&' (el hook ya trae ?key=...) y le codifica los ':' y '/'.
  # Si el tag no existe, o si la imagen no es la configurada en el servicio,
  # Render contesta 400 y el -f pone el paso en rojo.

  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]   # sin CI verde no hay deploy
    if: github.ref == 'refs/heads/main'      # los PRs verifican; solo main despliega
    environment:
      name: qa                               # sus secrets, su historial; sin reviewers a proposito
      url: https://tienda-front-qa.onrender.com
    timeout-minutes: 20
    steps:
      - name: Bajar el código al runner (para el script del smoke)
        uses: actions/checkout@v7

      # 🔴 El sha de ESTA corrida, no la punta de main: con dos merges seguidos,
      # la corrida de A no puede desplegar B, que todavia no paso por nada.
      - name: Desplegar en QA la IMAGEN del commit (api + front)
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
          IMG_API: ghcr.io/kindguyj/tienda-backend:sha-${{ github.sha }}
          IMG_FRONT: ghcr.io/kindguyj/tienda-frontend:sha-${{ github.sha }}
        run: |
          echo "imgURL api:   $IMG_API"
          echo "imgURL front: $IMG_FRONT"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"; echo
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"; echo

      - name: Smoke test de QA (con reintentos)
        shell: bash
        env:
          URL_API: https://tienda-api-qa.onrender.com
          URL_FRONT: https://tienda-front-qa.onrender.com
          COMMIT_ESPERADO: ${{ github.sha }}   # verde solo si contesta ESTE commit
        run: .github/scripts/smoke-entorno.sh

  # ==================== TP7: las pruebas como gate ====================
  #
  #   deploy-qa → integracion → e2e → [aprobación] → deploy-prod
  #
  # Integracion primero: es mas rapida y mas barata. Si la api esta rota, no se
  # gasta un browser en confirmarlo (la e2e queda salteada por su needs).
  # 🔴 Nada de continue-on-error, || true ni if: always() en este tramo: el
  # gate tiene que poder decir que no. Los unicos !cancelled() son los de los
  # pasos que publican el reporte, que importa MAS cuando algo fallo.
  #
  # environment: qa por los secrets: las credenciales del admin de QA viven en
  # ese environment, como los hooks. Un PR nunca las lee.

  integracion:
    runs-on: ubuntu-latest
    needs: deploy-qa                         # QA ya ejecuta la imagen de ESTA corrida
    environment: qa
    timeout-minutes: 15
    steps:
      - name: Bajar el código al runner
        uses: actions/checkout@v7
      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Instalar dependencias (sin browser)
        run: npm ci                          # sin playwright install: esta suite no abre navegador
        working-directory: ./app/frontend
      - name: Integración contra la api de QA
        env:
          API_BASE_URL: https://tienda-api-qa.onrender.com   # la API, no el front
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: npx playwright test e2e/api.spec.js
        working-directory: ./app/frontend
      - name: Publicar el reporte de integración
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-integracion  # distinto del de e2e: dos iguales rompen la corrida
          path: app/frontend/playwright-report
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: integracion                       # si la api esta rota, no se gasta un browser
    environment: qa
    timeout-minutes: 20                      # si algo se cuelga, el job muere en vez de esperar horas
    steps:
      - name: Bajar el código al runner
        uses: actions/checkout@v7
      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Instalar dependencias y Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: ./app/frontend
      - name: e2e contra el front de QA
        env:
          E2E_BASE_URL: https://tienda-front-qa.onrender.com  # el FRONT
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: npx playwright test e2e/tienda.spec.js   # SU archivo: sin esto correria tambien la integracion
        working-directory: ./app/frontend
      - name: Publicar el reporte e2e
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-e2e
          path: app/frontend/playwright-report
          retention-days: 7

  deploy-prod:
    runs-on: ubuntu-latest
    # Sin el if de rama, y no es un olvido: depende (via e2e → integracion) de
    # deploy-qa, que si lo tiene. En un PR ninguno corre: se hereda.
    # 🔴 EL gate: sin e2e verde, ni siquiera se pide aprobacion.
    needs: e2e
    environment:
      name: production                       # ⏸ el job NO arranca hasta que el reviewer apruebe
      url: https://tienda-front-prod.onrender.com
    # Evita dos deploys a PROD pisandose. NO ordena la cola de aprobaciones: una
    # corrida vieja esperando aprobacion sobrevive a una nueva, y aprobarla
    # despues haria retroceder PROD. Eso se resuelve a mano: rechazar la vieja.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - name: Bajar el código al runner (para el script del smoke)
        uses: actions/checkout@v7

      # 🔴 Aca mas que en ningun lado: entre que la corrida queda esperando y
      # que alguien aprueba pueden pasar horas, y main se mueve. Por eso la
      # imagen se nombra con el sha de la corrida: la MISMA que verifico QA.
      - name: Desplegar en PROD la MISMA imagen que verificó QA (api + front)
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
          IMG_API: ghcr.io/kindguyj/tienda-backend:sha-${{ github.sha }}
          IMG_FRONT: ghcr.io/kindguyj/tienda-frontend:sha-${{ github.sha }}
        run: |
          echo "imgURL api:   $IMG_API"
          echo "imgURL front: $IMG_FRONT"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"; echo
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"; echo

      - name: Smoke test de PROD (con reintentos)
        shell: bash
        env:
          # Con sufijo: tienda-api-prod.onrender.com ya era de otra persona.
          URL_API: https://tienda-api-prod-39qz.onrender.com
          URL_FRONT: https://tienda-front-prod.onrender.com
          COMMIT_ESPERADO: ${{ github.sha }}
        run: .github/scripts/smoke-entorno.sh

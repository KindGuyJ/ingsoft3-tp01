name: tienda-indumentaria
services:
  # ==================== Base de datos ====================
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_SCHEMA}
    volumes:
      # Volumen NOMBRADO (no bind mount): los datos sobreviven a que el
      # contenedor se destruya y se recree.
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASS}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ==================== API ====================
  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_SCHEMA: ${DB_SCHEMA}
      JWT_SECRET: ${JWT_SECRET}
      JWT_HORAS: ${JWT_HORAS}
      UMBRAL_ENVIO_GRATIS: ${UMBRAL_ENVIO_GRATIS}
      COSTO_ENVIO: ${COSTO_ENVIO}
      UPLOADS_DIR: /app/uploads
      MAX_IMAGEN_MB: ${MAX_IMAGEN_MB}
    volumes:
      # Segundo caso de persistencia, ademas de la base: las imagenes que sube
      # el admin. Buen material para la defensa.
      - uploads_data:/app/uploads
    ports:
      - "8080:8080"   # para curl/Postman; el browser entra por el 3000
    depends_on:
      db:
        # No alcanza con que el contenedor haya arrancado: hay que esperar a
        # que MySQL acepte conexiones. Eso es lo que agrega service_healthy.
        condition: service_healthy

  # ==================== Frontend ====================
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
  uploads_data:

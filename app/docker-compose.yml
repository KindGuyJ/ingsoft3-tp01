name: tienda-indumentaria
services:
  # ==================== Base de datos ====================
  db:
    # Postgres y no MySQL desde el TP6: es lo que ofrece Neon, el proveedor de
    # QA y PROD. La version es la misma en dev que en los entornos.
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_SCHEMA}
    volumes:
      # Volumen NOMBRADO (no bind mount): los datos sobreviven a que el
      # contenedor se destruya y se recree. Se llama pg_data y no db_data
      # para no montar el volumen viejo de MySQL: Postgres no inicializa sobre
      # un directorio con archivos ajenos.
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_SCHEMA}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ==================== API ====================
  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_SCHEMA: ${DB_SCHEMA}
      DB_SSLMODE: disable   # red interna de Docker; en Neon va "require"
      JWT_SECRET: ${JWT_SECRET}
      JWT_HORAS: ${JWT_HORAS}
      UMBRAL_ENVIO_GRATIS: ${UMBRAL_ENVIO_GRATIS}
      COSTO_ENVIO: ${COSTO_ENVIO}
      UPLOADS_DIR: /app/uploads
      MAX_IMAGEN_MB: ${MAX_IMAGEN_MB}
    volumes:
      # Segundo caso de persistencia, ademas de la base: las imagenes que sube
      # el admin. Buen material para la defensa.
      - uploads_data:/app/uploads
    ports:
      - "8080:8080"   # para curl/Postman; el browser entra por el 3000
    depends_on:
      db:
        # No alcanza con que el contenedor haya arrancado: hay que esperar a
        # que Postgres acepte conexiones. Eso es lo que agrega service_healthy.
        condition: service_healthy

  # ==================== Frontend ====================
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pg_data:
  uploads_data:
